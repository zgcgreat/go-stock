version: '3.8'

services:
  backend:
    build: .
    image: go-stock-backend
    container_name: go-stock-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - GO_STOCK_WEB_PORT=8080
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - go-stock-net

  frontend:
    image: go-stock-frontend
    container_name: go-stock-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - go-stock-net

networks:
  go-stock-net:
    driver: bridge